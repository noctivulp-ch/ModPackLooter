name: app · Release

# Publica binarios autocontenidos al crear una etiqueta app/vX.Y.Z.
# También se puede lanzar a mano: sin versión genera los binarios como
# artefactos; con versión (p. ej. v0.2.0) además crea la etiqueta app/<versión>
# sobre el commit lanzado y publica la release.
on:
  push:
    tags: ["app/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. v0.2.0-alpha.1). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Versión
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/app/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="modpacklooter-${{ steps.v.outputs.version }}-${GOOS}-${GOARCH}"
          bin="modpacklooter"; [ "$GOOS" = windows ] && bin="modpacklooter.exe"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "dist/$name/$bin" ./cmd/modpacklooter
          cp README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: modpacklooter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            app/dist/*.zip
            app/dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/app/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - name: Notas escritas a mano
        id: notes
        # docs/releases/<versión>.md va arriba; debajo, la lista automática de cambios.
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#app/}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          notes="docs/releases/${version}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app/${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ModPackLooter ${{ steps.notes.outputs.version }}
          prerelease: ${{ contains(steps.notes.outputs.version, '-') }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
