{{define "content"}}
{{$b := .Data}}
<nav class="crumbs" aria-label="Ruta"><a href="{{rel .Root "pesca/"}}">Pesca</a> / <a href="{{rel .Root $b.Source.URL}}">{{$b.Source.Name}}</a></nav>
<header class="item-title">
  <h1>Pescar en {{$b.Name}}</h1>
  <p>{{$b.Source.Name}}{{if $b.Dimension}} · {{$b.Dimension}}{{end}}{{if $b.Biome}} · <a href="{{rel .Root $b.Biome.URL}}">el bioma</a>{{end}}</p>
</header>
{{range $b.Groups}}{{template "fishGroup" (dict "Root" $.Root "G" .)}}{{end}}
{{end}}
